name: Build all-in-one

on:
  push:
    tags:
      - v4.*
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (for example, v4.10.20)
        required: true
        type: string

jobs:
  allinone:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        component: [all]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v7.0.0-28
      - uses: docker/setup-buildx-action@v3
      - name: Get Version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME}}"
          if [[ ! "$version" =~ ^v4\.[0-9]+\.[0-9]+([.-][a-zA-Z0-9.-]+)?$ ]]; then
            echo "Invalid v4 version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./allinone
          file: ./allinone/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            version=${{ env.version }}-ce
          tags: |
            ${{ github.repository_owner }}/jms_${{ matrix.component }}:${{ env.version }}
            ${{ github.repository_owner }}/jms_${{ matrix.component }}:latest
            ghcr.io/${{ github.repository_owner }}/jms_${{ matrix.component }}:${{ env.version }}
            ghcr.io/${{ github.repository_owner }}/jms_${{ matrix.component }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Release
        id: create_release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ env.version }}
        with:
          script: |
            const tag = process.env.VERSION;
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              core.info(`Release ${tag} already exists; skipping creation.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `Release ${tag}`,
                draft: false,
                prerelease: false,
              });
            }
